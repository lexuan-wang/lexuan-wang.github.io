url: "https://lexuanwang.com"

# Site settings
title: 王乐轩
email: wanglexuan@cuc.edu.cn
description: >-
  王乐轩个人学术主页 — 中国传媒大学政治传播研究所博士研究生，
  研究领域为政治传播、国际传播、信息地缘政治与论坛外交。
minimal_mistakes_skin: contrast
search: false
locale: zh-CN
google_site_verification: "DQIVcWls_Cd--KxGZ8dNxvmCCboznc9SusyTDeSPEwc"

# Build settings
markdown: kramdown
remote_theme: mmistakes/minimal-mistakes

include:
  - _pages

plugins:
  - jekyll-paginate
  - jekyll-sitemap
  - jekyll-gist
  - jemoji
  - jekyll-include-cache

author:
  name   : "王乐轩"
  avatar : "/assets/images/bio-photo.jpg"
  bio    : "博士研究生<br>政治传播研究所<br>政府与公共事务学院<br>中国传媒大学"
  links:
    - label: "Email"
      icon: "fas fa-fw fa-envelope"
      url: "mailto:wanglexuan@cuc.edu.cn"
    - label: "ORCID"
      icon: "fab fa-fw fa-orcid"
      url: "https://orcid.org/0009-0007-1991-6579"
    - label: "Google Scholar"
      icon: "fas fa-fw fa-graduation-cap"
      url: "https://scholar.google.com/citations?user=ZvAmIvEAAAAJ&hl=zh-CN"
    - label: "ResearchGate"
      icon: "fab fa-fw fa-researchgate"
      url: "https://www.researchgate.net/profile/Lexuan-Wang-8"

footer:
  links:
    - label: "Email"
      icon: "fas fa-fw fa-envelope"
      url: "mailto:wanglexuan@cuc.edu.cn"
    - label: "ORCID"
      icon: "fab fa-fw fa-orcid"
      url: "https://orcid.org/0009-0007-1991-6579"

defaults:
  - scope:
      path: "_pages"
      type: pages
    values:
      layout: single
      classes: wide
      author_profile: true
      # 只让首页进搜索结果，子页不索引、不进 sitemap
      noindex: true
      sitemap: false
